name: Train Churn Model

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "api/**"
      - "data/**"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run data cleaning
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/data_cleaning.py

      - name: Run feature engineering
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/feature_engineering.py

      - name: Train model
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/model_training.py

      - name: Run model evaluation
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/model_evaluation.py

      - name: Run SQL analysis
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/sql_analysis.py

      - name: Test risk prediction
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u src/risk_prediction.py

      - name: Test API import
        env:
          PYTHONUNBUFFERED: "1"
        run: python -c "from api.main import app; print('API import successful')"

      - name: Test API prediction
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u api/test_api.py

      - name: Commit generated project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/customer_churn_processed.csv
          git add data/customer_churn_features.csv
          git add data/customer_retention.db
          git add models/churn_logistic_regression.joblib
          git commit -m "Update generated project artifacts" || exit 0
          git push
